# ============================================================================
#  КЛИЕНТСКИЙ роутинг для mihomo / Clash.Meta (шаблон подписки Remnawave).
#
#  Два источника правил:
#    geositez-*  — наши списки (политика: что блокировать, что вести мимо VPN).
#    rv-*        — hydraponique/roscomvpn-* (инвентарь: подсети и домены РФ/РБ).
#
#  Полная раскладка «какой набор куда» — в README.
#
#  ВАЖНО: geositez-ads уже содержит ADS-NETWORKS (список подмешан через
#  include: при сборке), отдельный провайдер для него не нужен.
#
#  Провайдеров здесь 29 — это 29 скачиваний при первом старте. Если для
#  мобильного клиента много, выкинь игровые (rv-steam, rv-epicgames, rv-riot,
#  rv-origin, rv-eft, rv-faceit): без них игры просто пойдут в туннель.
# ============================================================================

rule-providers:
  # ─────────── наши списки ───────────
  geositez-connectivity:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://github.com/Mrzalupa-lolz/geositez/releases/latest/download/site-connectivity.txt"
    path: ./ruleset/geositez-connectivity.txt

  geositez-ads:
