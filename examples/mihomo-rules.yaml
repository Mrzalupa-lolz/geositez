# ===========================================================================
#  ПОРЯДОК. Первое совпавшее правило выигрывает. Четыре места, где перестановка
#  ломает схему молча — без ошибок в логах, просто перестаёт работать:
#
#   1. connectivity ВЫШЕ rv-apple  — captive.apple.com лежит в их apple (DIRECT).
#   2. twitch-ads   ВЫШЕ rv-twitch — gql.twitch.tv это поддомен twitch.tv.
#   3. system       ВЫШЕ rv-google-play — там mtalk.google.com, пуши FCM.
#   4. rv-geoblock  ВЫШЕ regex .ru — внутри habr.com и 4pda.ru.
#
#  Плюс ads выше rv-whitelist: mradx.net у них DIRECT, у нас REJECT.
# ===========================================================================
rules:
  # 1-3: проверка связи и мусор
  - RULE-SET,geositez-connectivity,🚀 VPN
  - RULE-SET,geositez-ads,REJECT
  - RULE-SET,rv-win-spy,REJECT

  # 4-5: Twitch — манифест в туннель, видео напрямую (Source без рекламы)
  - RULE-SET,geositez-twitch-ads,🚀 VPN
  - RULE-SET,rv-twitch,DIRECT

  # 6: пуши, обновления ОС, NTP, OCSP — строго мимо VPN
  - RULE-SET,geositez-system,DIRECT

  # 7-14: всё, что режет российские IP или недоступно из РФ
  - RULE-SET,geositez-ai,🚀 VPN
  - RULE-SET,rv-geoblock,🚀 VPN
  - RULE-SET,rv-deepmind,🚀 VPN
  - RULE-SET,rv-youtube,🚀 VPN
  - RULE-SET,rv-telegram,🚀 VPN
  - RULE-SET,rv-github,🚀 VPN
  - RULE-SET,rv-google-play,🚀 VPN
  - RULE-SET,rv-pinterest,🚀 VPN

  # 15-19: российское — напрямую
  - RULE-SET,geositez-ru,DIRECT
  - RULE-SET,rv-whitelist,DIRECT
  - RULE-SET,rv-category-ru,DIRECT
  - RULE-SET,rv-apple,DIRECT
  - RULE-SET,rv-microsoft,DIRECT

  # 20: игры — напрямую, туннель им только портит пинг
  - RULE-SET,rv-steam,DIRECT
  - RULE-SET,rv-epicgames,DIRECT
  - RULE-SET,rv-riot,DIRECT
  - RULE-SET,rv-origin,DIRECT
  - RULE-SET,rv-eft,DIRECT
  - RULE-SET,rv-faceit,DIRECT

  # 21: торренты — НАПРЯМУЮ. Через ноду это жалобы на IP и убитый канал
  - RULE-SET,rv-torrent,DIRECT

  # 22: зоны .ru / .su / .рф целиком
  - DOMAIN-REGEX,.*\.ru$,DIRECT
  - DOMAIN-REGEX,.*\.su$,DIRECT
  - DOMAIN-REGEX,.*\.xn--p1ai$,DIRECT

  # 23-25: сети РФ/РБ и локалка — ловят приложения, ходящие на голый IP
  - RULE-SET,rv-ip-direct,DIRECT,no-resolve
  - RULE-SET,rv-ip-whitelist,DIRECT,no-resolve
  - RULE-SET,rv-private-domain,DIRECT
  - RULE-SET,rv-ip-private,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve

  # 26: всё остальное
  - MATCH,🚀 VPN
