# ============================================================================
#  КЛИЕНТСКИЙ роутинг для mihomo / Clash.Meta (шаблон подписки Remnawave).
#
#  Два источника правил:
#    geositez-*  — наши списки (политика: что блокировать, что мимо VPN).
#    roscom-*    — hydraponique/roscomvpn-* (инвентарь: подсети и домены РФ/РБ).
#  Клиент не умеет читать .dat, поэтому оба забираются как rule-provider'ы.
# ============================================================================

rule-providers:
  # ---------- наши списки ----------
  # реклама -> REJECT
  geositez-ads:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://github.com/Mrzalupa-lolz/geositez/releases/latest/download/site-ads.txt"
    path: ./ruleset/geositez-ads.txt

  # российские сервисы, которых нет у roscomvpn -> DIRECT
  geositez-ru:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://github.com/Mrzalupa-lolz/geositez/releases/latest/download/site-ru.txt"
    path: ./ruleset/geositez-ru.txt

  # системные домены (пуши, обновления, время, OCSP) -> DIRECT
  geositez-system:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://github.com/Mrzalupa-lolz/geositez/releases/latest/download/site-system.txt"
    path: ./ruleset/geositez-system.txt

  # проверка связи -> В ТУННЕЛЬ (нода отправит их в direct)
  geositez-connectivity:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://github.com/Mrzalupa-lolz/geositez/releases/latest/download/site-connectivity.txt"
    path: ./ruleset/geositez-connectivity.txt

  # сервисы, режущие по IP сервера
  geositez-ai:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://github.com/Mrzalupa-lolz/geositez/releases/latest/download/site-ai.txt"
    path: ./ruleset/geositez-ai.txt

  # токен и манифест Twitch -> В ТУННЕЛЬ (см. data/geosite/twitch-ads.txt)
  geositez-twitch-ads:
    type: http
    behavior: classical
    format: text
    interval: 86400
    url: "https://github.com/Mrzalupa-lolz/geositez/releases/latest/download/site-twitch-ads.txt"
    path: ./ruleset/geositez-twitch-ads.txt

  # ---------- чужие списки: массовый РФ/РБ ----------
  # ~15 000 подсетей РФ/РБ, пересборка ежедневно
  roscom-direct-ip:
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip/release/mihomo/direct.mrs"
    path: ./ruleset/roscom-direct-ip.mrs

  # российские домены и сервисы
  roscom-whitelist:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/whitelist.mrs"
    path: ./ruleset/roscom-whitelist.mrs

  # сайты, которые режут функционал российским IP -> ИМ НУЖЕН ТУННЕЛЬ
  roscom-geoblock:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/category-geoblock-ru.mrs"
    path: ./ruleset/roscom-geoblock.mrs

  # сам Twitch (без токена/манифеста) -> DIRECT, чтобы видео не жрало трафик ноды
  roscom-twitch:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/twitch.mrs"
    path: ./ruleset/roscom-twitch.mrs

# ---------------------------------------------------------------------------
# ПОРЯДОК ВАЖЕН: первое совпавшее правило выигрывает. Три места, где порядок
# решает всё:
#   1. CONNECTIVITY выше SYSTEM/RU/whitelist — иначе captive.apple.com уедет
#      в DIRECT и пинг будет мериться мимо VPN.
#   2. TWITCH-ADS выше twitch и выше DOMAIN-REGEX .tv — gql.twitch.tv это
#      поддомен twitch.tv, и общее правило перехватит его первым.
#   3. ADS выше whitelist — mradx.net (рекламный CDN Mail.ru) у них в
#      whitelist на DIRECT, у нас в ADS на REJECT. Хотим REJECT.
# ---------------------------------------------------------------------------
rules:
  - RULE-SET,geositez-connectivity,🚀 VPN
  - RULE-SET,geositez-ads,REJECT

  # Twitch: манифест в туннель, само видео напрямую — Source без рекламы
  - RULE-SET,geositez-twitch-ads,🚀 VPN
  - RULE-SET,roscom-twitch,DIRECT

  - RULE-SET,geositez-system,DIRECT

  # сайты, режущие российские IP, — раньше любых DIRECT-правил на .ru
  - RULE-SET,roscom-geoblock,🚀 VPN
  - RULE-SET,geositez-ai,🚀 VPN

  # массовый РФ/РБ: домены и подсети
  - RULE-SET,geositez-ru,DIRECT
  - RULE-SET,roscom-whitelist,DIRECT
  - RULE-SET,roscom-direct-ip,DIRECT,no-resolve

  # зоны .ru / .su / .рф целиком — регулярками, поштучно их перечислять незачем
  - DOMAIN-REGEX,.*\.ru$,DIRECT
  - DOMAIN-REGEX,.*\.su$,DIRECT
  - DOMAIN-REGEX,.*\.xn--p1ai$,DIRECT

  - GEOIP,private,DIRECT,no-resolve
  - MATCH,🚀 VPN
